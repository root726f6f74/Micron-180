#    G1 E-110 F3000

    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state


###############################################################################################
# Prime Line
###############################################################################################
[gcode_macro PRIME_LINE]
gcode:
    G21    
    G90
    M83
    G92 E0
    
    G1 X10 Y5 F27000 ; move to start
    G1 Z0.35 F300 ; Move to layer height
    G1 E3 F500
    G1 X60 Y5 E8 F1800 ; print line
    G1 X120 Y5 E10 F1800 ; print line
    G1 E-0.5 F1800 ; retract
    G1 X160 Y5 F27000
    G92 E0