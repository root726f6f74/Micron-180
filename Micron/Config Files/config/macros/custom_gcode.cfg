#    M82
#    G92 E0
#    G1 E2 F3600
#    G1 E0 F3600
#    G1 E3 F3600
#    G1 E0 F3600
#    G1 E4 F3600
#    G1 E0 F3600

    # set last pressure advance
#    SET_PRESSURE_ADVANCE ADVANCE={old_pressure_advance}
#   RESTORE_GCODE_STATE NAME=TIP_SHAPING_state
# Tip Shaping - End   -----------------------------------------------------------------------------------------------------

    M83
    G1 E5 F300                    ; extrude a little to soften tip
    G1 E-15 F3600                  ; jerk the filament out of the melt zone
    G4 P3000
    G1 E-110 F3000                 ; retract the rest of the way

#    G1 E-20 F3600
